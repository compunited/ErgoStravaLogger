name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained directory
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish ErgoStravaLogger/ErgoStravaLogger.csproj \
            --configuration Release --runtime "${{ matrix.rid }}" --self-contained true \
            -p:ContinuousIntegrationBuild=true --output dist
          cp LICENSE README.md SECURITY.md THIRD-PARTY-NOTICES.md dist/
          cp -R docs deploy dist/
          python .github/scripts/collect-licenses.py \
            ErgoStravaLogger/obj/project.assets.json dist/licenses "${{ matrix.rid }}"
          test -s dist/config.json
          test -s dist/wwwroot/index.html
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            cp .github/scripts/start.cmd dist/
          else
            cp .github/scripts/start.sh dist/
            chmod +x dist/ErgoStravaLogger dist/start.sh
          fi
      - name: Verify the published application offline
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/ErgoStravaLogger"
          if [[ "${{ matrix.rid }}" == win-* ]]; then APP="$APP.exe"; fi
          python .github/scripts/smoke-simulate.py "$APP"
      - name: Package archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          NAME="ErgoStravaLogger-${RELEASE_TAG}-${{ matrix.rid }}"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            python -c 'import shutil,sys; shutil.make_archive(sys.argv[1], "zip", "dist")' "release/$NAME"
          else
            tar -C dist -czf "release/$NAME.tar.gz" .
          fi
          ( cd release && sha256sum * > "SHA256SUMS-${{ matrix.rid }}.txt" )
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.rid }}
          path: release/*
          if-no-files-found: error

  release:
    name: Create downloadable release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: release
      - name: Resolve release tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "RELEASE_TAG=${INPUT_TAG:-${GITHUB_REF_NAME}}" >> "$GITHUB_ENV"
      - name: Create release with verified tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
