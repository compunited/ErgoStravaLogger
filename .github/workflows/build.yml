name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ErgoStravaLogger.sln
      - run: dotnet build ErgoStravaLogger.sln --configuration Release --no-restore
      - name: Run protocol, recording, web and integration tests with local fakes
        run: dotnet run --project tests/ErgoStravaLogger.Tests.csproj --configuration Release --no-build
      - name: Audit dependencies
        run: dotnet list ErgoStravaLogger.sln package --vulnerable --include-transitive --no-restore
      - name: Verify offline simulation
        run: python .github/scripts/smoke-simulate.py ErgoStravaLogger/bin/Release/net10.0/ErgoStravaLogger.dll

  container:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pull updates and persistent mounts without a Docker daemon
        run: python .github/scripts/smoke-update-helper.py
      - run: docker build --tag ergo-strava:ci .
      - run: docker run --rm --network none ergo-strava:ci --help
      - name: Validate the standalone image configuration
        run: docker compose --project-directory . --env-file deploy/.env.image.example -f deploy/compose.image.yaml config --quiet

  publish-main:
    name: Publish tested main Docker image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and test each Linux image without network or persistent data
        shell: bash
        run: |
          set -euo pipefail
          for ARCH in amd64 arm64; do
            docker buildx build --platform "linux/$ARCH" --load --tag "ergostrava:smoke-$ARCH" .
            docker run --rm --platform "linux/$ARCH" --network none --read-only \
              --tmpfs /tmp --tmpfs /data --env STRAVA_ENABLED=false \
              --entrypoint /bin/sh "ergostrava:smoke-$ARCH" -ec \
              'test -s /app/config.json; test -s /app/wwwroot/index.html; dotnet /app/ErgoStravaLogger.dll simulate --config /app/config.json; test "$(find /data/simulation -name "*.tcx" | wc -l)" -eq 1'
          done
      - name: Check that this is still the current main commit
        id: current
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$HEAD_SHA" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit will publish its own tested image.'
          fi
      - name: Log in to GitHub Container Registry
        if: steps.current.outputs.publish == 'true'
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Publish tested platforms
        if: steps.current.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/compunited/ergostravalogger:main
            ghcr.io/compunited/ergostravalogger:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/compunited/ErgoStravaLogger
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=main
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
